<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909" id="metaThemeColor">
  <meta name="robots" content="noindex, follow">
  <title>404 — Page Not Found | Gradient AI</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23c7f36b'%3E%3Cpath d='M5 16.5 12 4l7 12.5h-5.1L12 12.7l-1.9 3.8H5Z'/%3E%3Cpath d='M8 20h8' stroke='%23c7f36b' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
      --bg: #090909;
      --surface: #111111;
      --surface2: #181818;
      --text: #f7f6f2;
      --muted: #95948f;
      --line: rgba(255,255,255,.11);
      --accent: #c7f36b;
      --accent-glow: rgba(199,243,107,.18);
      --accent-ink: #0f1208;
    }

    body.light {
      color-scheme: light;
      --bg: #f6f5f0;
      --surface: #ffffff;
      --surface2: #eceae3;
      --text: #141412;
      --muted: #6e6d67;
      --line: rgba(0,0,0,.10);
      --accent: #9ad833;
      --accent-glow: rgba(154,216,51,.22);
      --accent-ink: #101407;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: var(--bg); color: var(--text);
      font-family: "DM Sans", sans-serif;
      display: flex; flex-direction: column; justify-content: space-between;
      overflow-x: hidden; transition: background .25s, color .25s;
    }

    a { color: inherit; text-decoration: none; }

    header {
      padding: 24px 32px; display: flex; justify-content: space-between; align-items: center;
    }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-family: Manrope, sans-serif; font-size: 18px; }
    .brand-mark {
      width: 30px; height: 30px; display: grid; place-items: center;
      border-radius: 9px; background: var(--accent); color: var(--accent-ink);
    }
    .brand-mark svg { width: 17px; height: 17px; }

    .theme-btn {
      width: 38px; height: 38px; border-radius: 50%;
      border: 1px solid var(--line); background: transparent;
      display: grid; place-items: center; cursor: pointer; color: var(--text);
    }
    .theme-btn:hover { background: var(--surface2); }
    .theme-btn svg { width: 18px; height: 18px; }

    main {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 40px 24px; position: relative;
    }
    .hero-glow {
      position: absolute; width: min(480px, 80vw); aspect-ratio: 1; border-radius: 50%;
      background: radial-gradient(circle, var(--accent-glow), transparent 65%);
      filter: blur(40px); pointer-events: none; z-index: 0;
    }

    .error-card {
      position: relative; z-index: 1; max-width: 540px;
      padding: 44px 36px; border: 1px solid var(--line); border-radius: 28px;
      background: var(--surface); box-shadow: 0 20px 80px rgba(0,0,0,.3);
    }
    .error-code {
      display: inline-block; padding: 4px 14px; border-radius: 100px;
      background: var(--surface2); border: 1px solid var(--line);
      font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .1em;
      margin-bottom: 20px;
    }
    h1 {
      font-family: Manrope, sans-serif; font-size: clamp(32px, 5vw, 44px);
      font-weight: 700; letter-spacing: -.05em; margin: 0 0 14px; line-height: 1.15;
    }
    p { color: var(--muted); font-size: 15px; line-height: 1.7; margin: 0 0 32px; }

    .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .button {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 44px; padding: 0 20px; border-radius: 100px; font-size: 13.5px;
      font-weight: 650; cursor: pointer; transition: transform .2s, background .2s;
    }
    .button:hover { transform: translateY(-2px); }
    .button-primary { background: var(--accent); color: var(--accent-ink); }
    .button-primary:hover { background: #d7ff8b; }
    .button-outline { border: 1px solid var(--line); background: transparent; }
    .button-outline:hover { background: var(--surface2); }

    footer {
      padding: 24px; text-align: center; font-size: 12px; color: var(--muted);
      border-top: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 16.5 12 4l7 12.5h-5.1L12 12.7l-1.9 3.8H5Z" fill="currentColor"/><path d="M8 20h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
      gradient<span style="color:var(--accent)">.</span>
    </a>

    <button class="theme-btn" id="themeBtn" aria-label="Toggle theme">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>
      </svg>
    </button>
  </header>

  <main>
    <div class="hero-glow"></div>
    <div class="error-card">
      <span class="error-code">ERROR 404</span>
      <h1>Empty orbit detected.</h1>
      <p>The page, model route, or document you were looking for doesn't exist or has moved to a new destination.</p>

      <div class="btn-group">
        <a class="button button-primary" href="/">← Return to Homepage</a>
        <a class="button button-outline" href="/app">Launch Studio App ↗</a>
      </div>
    </div>
  </main>

  <footer>
    © <span id="year"></span> Gradient AI. Intelligence, thoughtfully designed.
  </footer>

  <script>
    const themeBtn = document.getElementById("themeBtn");
    const themeIcon = document.getElementById("themeIcon");
    const metaTheme = document.getElementById("metaThemeColor");

    function applyTheme(isLight) {
      if (isLight) {
        document.body.classList.add("light");
        metaTheme.setAttribute("content", "#f6f5f0");
        themeIcon.innerHTML = '<path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"/>';
      } else {
        document.body.classList.remove("light");
        metaTheme.setAttribute("content", "#090909");
        themeIcon.innerHTML = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>';
      }
    }

    const saved = localStorage.getItem("gradient_theme");
    applyTheme(saved === "light");

    themeBtn.addEventListener("click", () => {
      const isLight = document.body.classList.contains("light");
      applyTheme(!isLight);
      localStorage.setItem("gradient_theme", !isLight ? "light" : "dark");
    });

    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
